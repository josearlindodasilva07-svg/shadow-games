<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Games</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section id="home">
      <h1>Shadow Games</h1>
      <p>Party game multiplayer</p>

      <input id="name" maxlength="16" placeholder="Seu nome">

      <button id="create">Criar sala</button>
      <button id="join">Entrar em sala</button>
    </section>

    <section id="room" class="hidden">
      <h2>Sala</h2>

      <div class="code">
        <span>Código</span>
        <strong id="roomCode">------</strong>
      </div>

      <p id="status">Conectando...</p>

      <div id="players"></div>

      <button id="start">Começar partida</button>
    </section>

  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="game.js"></script>

</body>
</html>
