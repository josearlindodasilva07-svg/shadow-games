<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Shadow Games</title>

  <link rel="stylesheet" href="style.css?v=1">

  <script src="https://unpkg.com/three@0.175.0/build/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

<body>

  <div id="gameCanvas"></div>

  <!-- LOGIN -->
  <section id="loginScreen" class="screen">
    <div class="glass login-box">
      <div class="logo">
        <div class="logo-mark">S</div>
        <div>
          <h1>Shadow Games</h1>
          <p>Party multiplayer</p>
        </div>
      </div>

      <div class="field">
        <label>Seu nome</label>
        <input id="usernameInput" maxlength="16" autocomplete="off" placeholder="Digite seu nome">
      </div>

      <button id="loginButton" class="main-button">
        Entrar
      </button>

      <div id="loginStatus" class="status"></div>
    </div>
  </section>

  <!-- HOME -->
  <section id="homeScreen" class="screen hidden">
    <div class="glass home-box">

      <div class="profile">
        <div id="profileAvatar" class="avatar">?</div>

        <div>
          <span>Jogando como</span>
          <strong id="profileName">Player</strong>
        </div>
      </div>

      <div class="home-title">
        <span>SHADOW</span>
        <h1>GAMES</h1>
      </div>

      <button id="createRoomButton" class="main-button">
        Criar sala
      </button>

      <button id="showJoinButton" class="secondary-button">
        Entrar em uma sala
      </button>

      <button id="logoutButton" class="text-button">
        Sair da conta
      </button>

      <div id="homeStatus" class="status"></div>

      <div id="joinPanel" class="join-panel hidden">
        <input
          id="joinCodeInput"
          maxlength="6"
          autocomplete="off"
          placeholder="Código da sala"
        >

        <div class="join-buttons">
          <button id="joinRoomButton" class="main-button">
            Entrar
          </button>

          <button id="cancelJoinButton" class="secondary-button">
            Cancelar
          </button>
        </div>

        <div id="joinStatus" class="status"></div>
      </div>

    </div>
  </section>

  <!-- ROOM -->
  <section id="roomScreen" class="screen hidden">
    <div class="top-bar">
      <div class="brand-small">
        <div class="small-logo">S</div>
        <span>Shadow Games</span>
      </div>

      <button id="leaveRoomButton" class="danger-button">
        Sair
      </button>
    </div>

    <div class="room-layout">

      <div class="glass room-card">

        <div class="room-header">
          <div>
            <span class="eyebrow">SALA</span>

            <div class="room-code-row">
              <strong id="roomCodeText">------</strong>

              <button id="copyCodeButton" class="icon-button">
                Copiar
              </button>
            </div>
          </div>

          <div id="connectionBadge" class="connection-badge">
            Conectando
          </div>
        </div>

        <div class="players-title">
          <span>Jogadores</span>
          <strong id="playerCount">1/5</strong>
        </div>

        <div id="playersList" class="players-list"></div>

        <div class="room-actions">

          <button id="micButton" class="voice-button off">
            <span class="voice-dot"></span>
            <span id="micButtonText">Microfone desligado</span>
          </button>

          <button id="startGameButton" class="main-button start-button">
            Começar partida
          </button>

        </div>

        <div id="roomStatus" class="status"></div>

      </div>

    </div>

    <div class="controls-hint">
      <span>Arraste na tela para olhar</span>
      <span>Joystick para andar</span>
    </div>

    <!-- JOYSTICK -->
    <div id="joystick" class="joystick">
      <div id="joystickKnob" class="joystick-knob"></div>
    </div>

  </section>

  <!-- GAME -->
  <section id="gameScreen" class="screen hidden">

    <div class="game-top">

      <div class="game-round">
        <span>RODADA</span>
        <strong id="gameRound">1/4</strong>
      </div>

      <button id="gameVoiceButton" class="game-voice-button off">
        Mic OFF
      </button>

      <div class="game-players">
        <span>JOGADORES</span>
        <strong id="gamePlayerCount">1</strong>
      </div>

    </div>

    <div id="gameMessage" class="game-message glass">
      Preparando...
    </div>

    <div id="gameCenter" class="game-center hidden">

      <div class="countdown">
        <span id="countdownNumber">5</span>
      </div>

    </div>

    <div id="recordingPanel" class="recording-panel glass hidden">

      <div class="recording-icon">
        ●
      </div>

      <h2>Grave agora</h2>

      <p>
        Faça sua imitação.
      </p>

      <div id="recordTimer" class="record-timer">
        7
      </div>

      <div class="record-bar">
        <div id="recordProgress"></div>
      </div>

    </div>

    <div id="playbackPanel" class="playback-panel glass hidden">

      <span class="eyebrow">REPRODUÇÃO</span>

      <h2 id="playbackName">
        Player
      </h2>

      <div class="playback-wave">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
      </div>

      <p id="playbackStatus">
        Reproduzindo...
      </p>

      <div id="playbackScore" class="playback-score">
        —
      </div>

    </div>

  </section>

  <!-- REMOTE AUDIO -->
  <div id="remoteAudios"></div>

  <script src="game.js?v=1"></script>

</body>
</html>
